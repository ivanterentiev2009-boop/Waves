name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Скачать sherpa-onnx AAR (GigaAM)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          for tag in $(gh release list --repo k2-fsa/sherpa-onnx --limit 25 --json tagName -q '.[].tagName'); do
            if gh release download "$tag" --repo k2-fsa/sherpa-onnx --pattern '*.aar' --dir app/libs; then
              echo "AAR из релиза $tag"; break
            fi
          done
          ls -la app/libs
          BIG=$(ls -S app/libs/*.aar | head -1)
          [ -n "$BIG" ] || { echo "AAR sherpa-onnx не найден в релизах"; exit 1; }
          [ "$BIG" = "app/libs/sherpa-onnx.aar" ] || cp "$BIG" app/libs/sherpa-onnx.aar
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Waves-debug
          path: app/build/outputs/apk/debug/app-debug.apk
